<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>CAPITAL Admin · Login</title>
<link href="./assets/admin.css?v=12" rel="stylesheet"/>
</head>
<body data-page="login">
<main class="login-wrap">
<section class="login-card">
<div aria-label="CAPITAL logo" class="login-logo-wrap login-brand">
<img alt="CAPITAL" class="login-logo" src="./assets/logo-login-gray-v11.webp"/>
</div>
<div class="login-brand-title">CAPITAL Admin</div><div class="admin-login-language"><label>Language</label><select class="input" data-admin-language><option value="en">English</option><option value="fa">فارسی</option></select></div>
<form id="loginForm">
<div class="field"><label>Email</label><input autocomplete="username" class="input" placeholder="Administrator email" required="" type="email"/></div>
<div class="field"><label>Password</label><input autocomplete="current-password" class="input" placeholder="Administrator password" required="" type="password"/></div>
<button class="btn" type="submit">Sign in</button>
<p class="hint" data-admin-hint>Secure administrator login.</p>
</form>
</section>

</main>
<script src="./assets/admin.js?v=12"></script>
</body>
</html>
