<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPITAL | Reset Password</title><link href="assets/style.css" rel="stylesheet"></head><body class="register-page"><div class="app"><main class="container"><section class="hero"><h1 data-t="forgot">فراموشی رمز عبور</h1></section><section class="form"><form id="resetForm"><div class="register-field"><label data-t="email">ایمیل</label><input id="resetEmail" type="email" autocomplete="email" required></div><button class="btn" type="submit" id="requestBtn">ادامه</button></form><form id="newPasswordForm" hidden><div class="register-field"><label data-t="password">رمز عبور جدید</label><input id="newPassword" type="password" minlength="8" required></div><div class="register-field"><label data-t="confirm">تکرار رمز عبور</label><input id="confirmPassword" type="password" minlength="8" required></div><button class="btn" type="submit">ذخیره رمز عبور جدید</button></form><p class="hint" id="resetMessage"></p></section></main></div><script src="assets/api.js"></script><script src="assets/i18n.js"></script><script src="assets/app.js"></script><script>
(async()=>{const q=new URLSearchParams(location.search),token=q.get('token'),req=document.getElementById('resetForm'),form=document.getElementById('newPasswordForm'),msg=document.getElementById('resetMessage');if(token){req.hidden=true;form.hidden=false}req.addEventListener('submit',async e=>{e.preventDefault();try{await CapitalAPI.requestPasswordReset(document.getElementById('resetEmail').value);msg.textContent='If the account exists, a reset link has been sent.'}catch(_){msg.textContent='If the account exists, a reset link has been sent.'}});form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){msg.textContent='Passwords do not match.';return}try{await CapitalAPI.resetPassword(token,a);msg.textContent='Password changed successfully. You can now log in.';form.hidden=true}catch(err){msg.textContent=err.message}})})();
</script></body></html>
