<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>CAPITAL | Change Password</title><link href="assets/style.css" rel="stylesheet"/></head><body><div class="app"><main class="container profile-page" data-page-main="true"><section class="hero"><h1 data-t="changePasswordTitle">تغییر رمز عبور</h1><p data-t="changePasswordIntro">برای امنیت بیشتر، رمز عبور قوی انتخاب کنید.</p></section><section><form class="form profile-section" onsubmit="event.preventDefault();changeProfilePassword()"><label data-t="currentPasswordLabel" for="currentPassword">رمز عبور فعلی</label><input autocomplete="current-password" id="currentPassword" required="" type="password"/><label data-t="newPasswordLabel" for="newPassword">رمز عبور جدید</label><input autocomplete="new-password" id="newPassword" minlength="8" required="" type="password"/><label data-t="confirmNewPasswordLabel" for="confirmNewPassword">تکرار رمز عبور جدید</label><input autocomplete="new-password" id="confirmNewPassword" minlength="8" required="" type="password"/><button class="btn" data-t="saveNewPassword" type="submit">ذخیره رمز عبور جدید</button></form></section></main></div><div class="toast"></div><script src="assets/api.js"></script><script src="assets/i18n.js"></script><script src="assets/layout.js"></script><script src="assets/app.js"></script></body></html>
