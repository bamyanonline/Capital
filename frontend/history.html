<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>CAPITAL | History</title><link href="assets/style.css" rel="stylesheet"/>
</head>
<body class="history-page"><div class="app">


<main class="container" data-page-main="true">
<section class="hero"><h1 data-t="historyTitle">تاریخچه تراکنش‌ها</h1><p>تمام سوابق مالی حساب شما در یکجا</p></section>
<section aria-label="فیلتر تراکنش‌ها" class="history-filter">
<button class="history-filter-btn active" data-filter="all" type="button">همه تراکنش‌ها</button>
<button class="history-filter-btn" data-filter="deposit" type="button">واریز</button>
<button class="history-filter-btn" data-filter="profit" type="button">سود روزانه</button>
<button class="history-filter-btn" data-filter="withdraw" type="button">برداشت</button>
</section>
<section aria-labelledby="historyRecordsTitle" class="history-list-card">
  <div class="history-list-heading">
    <h2 id="historyRecordsTitle" data-t="historyRecords">سوابق تراکنش‌ها</h2>
  </div>
  <div aria-label="لیست تراکنش‌ها" class="history-list"></div>
</section>
</main></div><div class="toast"></div>

<script src="assets/api.js"></script><script src="assets/i18n.js"></script><script src="assets/layout.js"></script><script src="assets/app.js"></script></body></html>
